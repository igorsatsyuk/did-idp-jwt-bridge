server:
  port: 8083

spring:
  application:
    name: resource-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-32-chars}
