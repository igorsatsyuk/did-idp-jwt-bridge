server:
  port: 8081

spring:
  application:
    name: identity-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

blockchain:
  rpc-url: http://localhost:8545
  contract-address: ${DID_REGISTRY_ADDRESS:0x0000000000000000000000000000000000000000}
  # Hardhat account[0] default key — override via BLOCKCHAIN_PRIVATE_KEY env var in production
  account-private-key: ${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
