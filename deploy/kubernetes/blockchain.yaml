apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain
  namespace: did-idp
  labels:
    app: blockchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      containers:
        - name: ganache
          image: trufflesuite/ganache:latest
          imagePullPolicy: IfNotPresent
          args:
            - --chain.chainId
            - "1337"
            - --server.host
            - 0.0.0.0
            - --wallet.mnemonic
            - $(GANACHE_MNEMONIC)
            - --wallet.totalAccounts
            - "5"
            - --wallet.defaultBalance
            - "1000"
            - --miner.blockTime
            - "0"
            - --logging.verbose
          env:
            - name: GANACHE_MNEMONIC
              valueFrom:
                secretKeyRef:
                  name: did-idp-secrets
                  key: GANACHE_MNEMONIC
          ports:
            - containerPort: 8545
              name: rpc
          livenessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8545
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: blockchain
  namespace: did-idp
  labels:
    app: blockchain
spec:
  selector:
    app: blockchain
  ports:
    - name: rpc
      port: 8545
      targetPort: 8545

