apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: did-idp
  labels:
    app: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-service
          image: did-identity-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: BLOCKCHAIN_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: BLOCKCHAIN_RPC_URL
            - name: DID_REGISTRY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: did-idp-secrets
                  key: DID_REGISTRY_ADDRESS
            - name: BLOCKCHAIN_ACCOUNT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: did-idp-secrets
                  key: BLOCKCHAIN_ACCOUNT_PRIVATE_KEY
            - name: IDENTITY_KEY_ROTATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: did-idp-secrets
                  key: IDENTITY_KEY_ROTATION_TOKEN
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: did-idp
  labels:
    app: identity-service
spec:
  selector:
    app: identity-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-bridge-service
  namespace: did-idp
  labels:
    app: auth-bridge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-bridge-service
  template:
    metadata:
      labels:
        app: auth-bridge-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-bridge-service
          image: did-auth-bridge-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: did-idp-secrets
                  key: JWT_SECRET
            - name: IDENTITY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: IDENTITY_SERVICE_URL
            - name: DID_REGISTRY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: did-idp-secrets
                  key: DID_REGISTRY_ADDRESS
            - name: BLOCKCHAIN_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: BLOCKCHAIN_RPC_URL
            - name: JWT_REFRESH_EXPIRATION_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: JWT_REFRESH_EXPIRATION_MINUTES
            - name: AUTH_CHALLENGE_TTL_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: AUTH_CHALLENGE_TTL_MINUTES
            - name: AUTH_CHALLENGE_MAX_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: AUTH_CHALLENGE_MAX_ACTIVE
            - name: AUTH_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AUTH_TOKEN_RATE_LIMIT_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: AUTH_TOKEN_RATE_LIMIT_MAX_ATTEMPTS
            - name: AUTH_TOKEN_RATE_LIMIT_WINDOW_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: AUTH_TOKEN_RATE_LIMIT_WINDOW_SECONDS
            - name: AUTH_TOKEN_RATE_LIMIT_MAX_TRACKED_KEYS
              valueFrom:
                configMapKeyRef:
                  name: did-idp-config
                  key: AUTH_TOKEN_RATE_LIMIT_MAX_TRACKED_KEYS
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-bridge-service
  namespace: did-idp
  labels:
    app: auth-bridge-service
spec:
  selector:
    app: auth-bridge-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
